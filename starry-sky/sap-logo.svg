<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <defs>
    <!-- SAP 蓝渐变 -->
    <linearGradient id="sapBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008FD3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#007CC1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006BA8;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 内阴影效果 -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- SAP 蓝色背景块 - 圆角矩形 -->
  <rect x="5" y="5" width="110" height="50" rx="8" ry="8" 
        fill="url(#sapBlue)" 
        filter="url(#glow)"/>
  
  <!-- SAP 文字 -->
  <text x="60" y="40" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="2"
        filter="url(#innerShadow)">SAP</text>
  
  <!-- 高光效果 -->
  <rect x="5" y="5" width="110" height="25" rx="8" ry="8" 
        fill="url(#highlight)" 
        opacity="0.15"/>
  
  <defs>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>
