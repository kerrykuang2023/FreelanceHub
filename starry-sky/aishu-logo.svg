<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 爱数蓝渐变 -->
    <linearGradient id="aishuBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006699;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外层六边形边框 -->
  <polygon points="60,8 104,32 104,80 60,104 16,80 16,32" 
           fill="none" 
           stroke="url(#aishuBlue)" 
           stroke-width="3" 
           opacity="0.9"
           filter="url(#glow)"/>
  
  <!-- 中层六边形 -->
  <polygon points="60,20 92,38 92,74 60,92 28,74 28,38" 
           fill="none" 
           stroke="url(#aishuBlue)" 
           stroke-width="2" 
           opacity="0.6"/>
  
  <!-- 内层实心六边形 - 代表数据核心 -->
  <polygon points="60,32 80,44 80,68 60,80 40,68 40,44" 
           fill="url(#aishuBlue)" 
           opacity="0.85"
           filter="url(#glow)"/>
  
  <!-- 中心高光点 -->
  <circle cx="60" cy="56" r="6" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 六边形的六个顶点装饰点 -->
  <circle cx="60" cy="8" r="3" fill="#00a8e8" filter="url(#glow)"/>
  <circle cx="104" cy="32" r="3" fill="#00a8e8" filter="url(#glow)"/>
  <circle cx="104" cy="80" r="3" fill="#00a8e8" filter="url(#glow)"/>
  <circle cx="60" cy="104" r="3" fill="#00a8e8" filter="url(#glow)"/>
  <circle cx="16" cy="80" r="3" fill="#00a8e8" filter="url(#glow)"/>
  <circle cx="16" cy="32" r="3" fill="#00a8e8" filter="url(#glow)"/>
</svg>
