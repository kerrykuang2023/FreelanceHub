services:
  mongo:
    image: mongo
    container_name: job-portal-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    container_name: job-portal-server
    restart: unless-stopped
    ports:
      - "5555:5555"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/job-portal
      - NODE_ENV=development
    volumes:
      - ./server/src:/app/src
      - /app/node_modules

  client:
    build: ./client
    container_name: job-portal-client
    restart: unless-stopped
    ports:
      - "5137:5137"
    tty: true
    stdin_open: true
    environment:
      - VITE_API_URL=http://localhost:5555
    volumes:
      - ./client/src:/app/src
      - /app/node_modules

volumes:
  mongo-data:
